<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Task Tracker</title>
</head>

<body>
    <h1>AWS Serverless Three-Tier Task Tracker</h1>

    <p>
        Frontend: S3 + CloudFront |
        Backend: API Gateway + Lambda |
        Database: DynamoDB
    </p>

    <hr>

    <h2>Create Task</h2>

    <input type="text" id="taskTitle" placeholder="Enter a task">

    <button onclick="createTask()">
        Add Task
    </button>

    <p id="message"></p>

    <hr>

    <h2>Tasks</h2>

    <button onclick="loadTasks()">
        Refresh Tasks
    </button>

    <ul id="taskList"></ul>

    <script>
        const API_URL =
            "https://ro08n8xb7l.execute-api.us-east-1.amazonaws.com/tasks";


        async function loadTasks() {
            const taskList = document.getElementById("taskList");
            const message = document.getElementById("message");

            try {
                message.textContent = "Loading tasks...";

                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error("Failed to load tasks");
                }

                const data = await response.json();

                taskList.innerHTML = "";

                data.tasks.forEach(task => {
                    const listItem = document.createElement("li");

                    const taskText = document.createElement("span");

                    taskText.textContent =
                        `${task.title} - ${task.completed ? "Completed" : "Pending"} `;

                    listItem.appendChild(taskText);


                    // Only show the Complete button
                    // when the task is still pending.
                    if (!task.completed) {
                        const completeButton =
                            document.createElement("button");

                        completeButton.textContent =
                            "Complete";

                        completeButton.onclick = function () {
                            completeTask(task.task_id);
                        };

                        listItem.appendChild(completeButton);
                    }


                    // Every task can be deleted.
                    const deleteButton =
                        document.createElement("button");

                    deleteButton.textContent =
                        "Delete";

                    deleteButton.onclick = function () {
                        deleteTask(task.task_id);
                    };

                    listItem.appendChild(deleteButton);

                    taskList.appendChild(listItem);
                });

                message.textContent =
                    `Loaded ${data.tasks.length} task(s).`;

            } catch (error) {
                console.error(error);

                message.textContent =
                    "Error loading tasks.";
            }
        }


        async function createTask() {
            const taskInput =
                document.getElementById("taskTitle");

            const message =
                document.getElementById("message");

            const title =
                taskInput.value.trim();

            if (!title) {
                message.textContent =
                    "Please enter a task title.";

                return;
            }

            try {
                message.textContent =
                    "Creating task...";

                const response = await fetch(API_URL, {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        title: title
                    })
                });

                if (!response.ok) {
                    throw new Error("Failed to create task");
                }

                const data =
                    await response.json();

                message.textContent =
                    data.message;

                taskInput.value =
                    "";

                await loadTasks();

            } catch (error) {
                console.error(error);

                message.textContent =
                    "Error creating task.";
            }
        }


        async function completeTask(taskId) {
            const message =
                document.getElementById("message");

            try {
                message.textContent =
                    "Updating task...";

                const response = await fetch(
                    `${API_URL}/${taskId}`,
                    {
                        method: "PATCH"
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        "Failed to update task"
                    );
                }

                const data =
                    await response.json();

                message.textContent =
                    data.message;

                await loadTasks();

            } catch (error) {
                console.error(error);

                message.textContent =
                    "Error updating task.";
            }
        }


        async function deleteTask(taskId) {
            const message =
                document.getElementById("message");

            try {
                message.textContent =
                    "Deleting task...";

                const response = await fetch(
                    `${API_URL}/${taskId}`,
                    {
                        method: "DELETE"
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        "Failed to delete task"
                    );
                }

                const data =
                    await response.json();

                message.textContent =
                    data.message;

                await loadTasks();

            } catch (error) {
                console.error(error);

                message.textContent =
                    "Error deleting task.";
            }
        }


        loadTasks();
    </script>

</body>

</html>
