name: Deploy Serverless Three-Tier App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::585008089387:role/serverless-three-tier-github-actions
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity